version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: polyhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: polyhub
      POSTGRES_PASSWORD: polyhub_dev_password
      POSTGRES_DB: polyhub
    ports:
      - "5432:5432"
    volumes:
      - polyhub_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: polyhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: polyhub_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

  minio:
    image: minio/minio
    container_name: polyhub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: polyhub
      MINIO_ROOT_PASSWORD: polyhub_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - polyhub_minio_data:/data

volumes:
  polyhub_pg_data:
  polyhub_minio_data: